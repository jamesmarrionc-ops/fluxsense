<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ATLAS</title>
<style>
  /* Importing the sleek, modern fonts from the Fluxsense UI */
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #000000; /* True OLED Black for absolute stealth */
    --stealth-text: #2a2a2a; /* Barely visible dark gray */
    --stealth-active: #555555; /* Slightly lighter gray when tapped */
  }

  /* Reset and absolute lockdown to prevent native browser behaviors */
  *, *::before, *::after {
    margin: 0; 
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }

  html, body {
    width: 100%; 
    height: 100%;
    background-color: var(--bg);
    overflow: hidden;
    touch-action: none; /* Kills pinch-to-zoom and scrolling */
    font-family: 'Space Mono', monospace;
  }

  /* View Containers (Single Page App Architecture) */
  .view {
    position: absolute;
    top: 0; 
    left: 0;
    width: 100%; 
    height: 100%;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  /* Only the active view is displayed */
  .view.active {
    display: flex;
  }

  /* Navigation Layout */
  .menu-container {
    display: flex;
    flex-direction: column;
    gap: 50px;
  }

  /* Stealth Button Styling */
  .stealth-btn {
    background: transparent;
    border: none;
    color: var(--stealth-text);
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 6px;
    padding: 20px 40px;
    cursor: pointer;
    transition: color 0.1s ease;
  }

  .stealth-btn:active {
    color: var(--stealth-active);
  }

  /* Placeholder Styling for other views */
  .view-title {
    color: var(--stealth-active);
    font-size: 10px;
    letter-spacing: 4px;
    margin-bottom: 30px;
  }
</style>
</head>
<body>

  <div id="view-home" class="view active">
    <div class="menu-container">
      <button class="stealth-btn" onclick="switchView('view-perform')">[ PERFORM ]</button>
      <button class="stealth-btn" onclick="switchView('view-settings')">[ SETTINGS ]</button>
    </div>
  </div>

  <div id="view-settings" class="view">
    <div class="view-title">SETTINGS VAULT</div>
    <button class="stealth-btn" onclick="switchView('view-home')">[ BACK ]</button>
  </div>

  <div id="view-perform" class="view">
    <div class="view-title">SYSTEM ARMED</div>
    </div>

  <script>
    // --- SINGLE PAGE APP NAVIGATION LOGIC ---
    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    // --- TWO-FINGER SWIPE DOWN (Stealth Exit) ---
    let touchStartY = 0;
    let isTwoFingerSwipe = false;

    document.addEventListener('touchstart', (e) => {
      // Only listen if we are in the PERFORM view and two fingers are used
      if (e.touches.length === 2 && document.getElementById('view-perform').classList.contains('active')) {
        isTwoFingerSwipe = true;
        // Get the average starting Y position of both fingers
        touchStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      } else {
        isTwoFingerSwipe = false;
      }
    });

    document.addEventListener('touchend', (e) => {
      if (isTwoFingerSwipe) {
        // Because touchend might only trigger for one finger leaving at a time, 
        // we execute the exit immediately upon release if a downward motion was detected.
        // For production, you can calculate the distance traveled.
        switchView('view-home');
        isTwoFingerSwipe = false;
        touchStartY = 0;
      }
    });
  </script>
</body>
</html>
